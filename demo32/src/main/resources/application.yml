# 应用服务 WEB 访问端口
server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vectordb
    username: user
    password: user123
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
  ai:
    vectorstore:
      pgvector:
        # 自动创建向量存储所需的表和索引（生产环境建议关闭，用 Flyway 管理）
        initialize-schema: true
        # 向量维度（必须与 EmbeddingModel 输出维度一致）
        dimensions: 1024
        # 索引类型：HNSW（高性能近似搜索）或 IVFFLAT（精确但慢）
        index-type: HNSW
        # 距离算法：COSINE_DISTANCE（最常用）、EUCLIDEAN_DISTANCE、NEGATIVE_INNER_PRODUCT
        distance-type: COSINE_DISTANCE
    # ── OpenAI 配置 ──────────────────────────────────────────
#    openai:
#      api-key: ${OPENAI_API_KEY}        # 从环境变量读取，避免硬编码到代码库
#      base-url: https://api.openai.com  # 可替换为代理地址或兼容服务（如 DeepSeek）
#      chat:
#        options:
#          model: gpt-4o-mini            # 默认使用的模型，可在运行时覆盖
#          temperature: 0.7              # 生成随机性，0=确定性，1=最随机
#          max-tokens: 2048              # 单次响应最大 token 数
#          top-p: 1.0                    # 核采样，通常与 temperature 二选一
#      embedding:
#        options:
#          model: text-embedding-3-small # 嵌入模型，独立配置

    # ── Ollama 本地配置 ───────────────────────────────────────
    ollama:
      base-url: http://localhost:11434  # Ollama 默认端口
      embedding:
        model: bge-m3                 # embedding 模型
      chat:
        options:
          model: llama3.2               # 已 pull 的本地模型名称
          temperature: 0.7

    # ── DeepSeek 配置（复用 OpenAI Starter）────────────────────
    # 在 application-deepseek.yml 中：
    # openai:
    #   api-key: ${DEEPSEEK_API_KEY}
    #   base-url: https://api.deepseek.com
    #   chat:
    #     options:
    #       model: deepseek-chat

logging:
  level:
    # 开启 Spring AI 的请求/响应日志，便于调试
    org.springframework.ai: INFO

